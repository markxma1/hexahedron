# Builds every platform and, for a version tag (v*), publishes a GitHub release.
# Start it by pushing a tag:  git tag v0.1 && git push origin v0.1
# or by hand from the Actions tab (then the files stay as run artifacts only).
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Oldest supported runner: the binary then runs on glibc 2.35+ distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libdecor-0-dev libudev-dev libdbus-1-dev
      - name: Build
        run: .github/scripts/build_pc.sh HEXAHEDRON-linux-x86_64 -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
      - name: Ubuntu/Debian package
        run: .github/scripts/make_deb.sh "${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            zip curl tar
      - name: Build
        run: .github/scripts/build_pc.sh HEXAHEDRON-windows-x64 -DCMAKE_EXE_LINKER_FLAGS="-static"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: "Build (universal: Apple Silicon + Intel)"
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          .github/scripts/build_pc.sh HEXAHEDRON-macos-universal \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/* }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.31.6" >/dev/null
      - name: Build APK
        working-directory: src/platform/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Collect
        run: |
          mkdir -p dist
          cp src/platform/android/app/build/outputs/apk/debug/app-debug.apk dist/HEXAHEDRON-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/* }

  ps3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ps3dev toolchain, Cg Toolkit and PSL1GHT source
        run: |
          cd "$HOME"
          curl -sSL https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz | tar -xz
          mkdir -p cg && curl -sSL https://developer.download.nvidia.com/cg/Cg_3.1/Cg-3.1_April2012_x86_64.tgz | tar -xz -C cg
          git init -q psl1ght-src && cd psl1ght-src
          git fetch -q --depth 1 https://github.com/ps3dev/PSL1GHT.git f649a08fd536a9e27c08c7db2d93a2d7ee4c3bbe
          git checkout -q FETCH_HEAD
      - name: Build package
        run: |
          export PS3DEV=$HOME/ps3dev PSL1GHT=$HOME/ps3dev
          export PATH=$PS3DEV/bin:$PS3DEV/ppu/bin:$PATH
          export LD_LIBRARY_PATH=$HOME/cg/usr/lib64
          src/platform/ps3/tools/build_cgcomp.sh "$HOME/psl1ght-src"
          cd src/platform/ps3
          make -j"$(nproc)"
          make pkg
          mkdir -p ../../../dist
          cp hexahedron.pkg ../../../dist/HEXAHEDRON-ps3.pkg
      - uses: actions/upload-artifact@v4
        with: { name: ps3, path: dist/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android, ps3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
