// Android build: the native part is the SAME code as the PC version
// (src/core + src/game + src/platform/sdl3_gl), built with GLES 3.0 and touch input.
plugins {
    id 'com.android.application'
}

android {
    namespace = "com.xma1.hexahedron"
    compileSdkVersion 35
    ndkVersion = "27.3.13750724"
    defaultConfig {
        applicationId "com.xma1.hexahedron"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "0.1"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24", "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly (sideloading).
            signingConfig signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path '../../../../CMakeLists.txt'   // repository root
            version '3.31.6'
        }
    }
    sourceSets.main {
        assets.srcDirs = ['../../../../assets']  // same fonts as the PC version
    }
    lint {
        abortOnError = false
    }
}
